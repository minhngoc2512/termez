name: Build apps

# Build native installers for Linux, macOS (Apple Silicon + Intel) and Windows
# and attach them to the GitHub Release for the tag. Push a tag `vX.Y.Z`
# (or run manually with a tag) to trigger it.
#
# Note: builds are UNSIGNED — macOS Gatekeeper / Windows SmartScreen will warn.
# The sidecar (kdbx-import) and the frontend are built by tauri.conf's
# beforeBuildCommand, so no extra steps are needed here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build into (e.g. v0.2.11)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04    # Linux: .deb / .AppImage / .rpm
            args: ""
          - platform: macos-14        # macOS universal (Intel + Apple Silicon): one .dmg
            args: "--target universal-apple-darwin"
          - platform: windows-latest  # Windows: .msi / NSIS .exe
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      # macOS universal: tauri builds each arch separately and lipos the APP, so
      # it needs a sidecar for EACH arch triple (not a lipo'd "universal" one).
      - name: Add macOS universal Rust targets
        if: matrix.platform == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS sidecars (per-arch + universal)
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          crate=src-tauri/sidecar/kdbx-import
          mkdir -p src-tauri/binaries
          # per-arch: needed while tauri compiles each arch separately
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path "$crate/Cargo.toml" --target "$triple"
            cp "$crate/target/$triple/release/kdbx-import" "src-tauri/binaries/kdbx-import-$triple"
          done
          # universal: needed while tauri bundles the universal .app
          lipo -create \
            src-tauri/binaries/kdbx-import-aarch64-apple-darwin \
            src-tauri/binaries/kdbx-import-x86_64-apple-darwin \
            -output src-tauri/binaries/kdbx-import-universal-apple-darwin

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Termez ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
