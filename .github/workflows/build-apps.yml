name: Build apps

# Build bộ cài Termez (Electron) cho Linux, macOS (universal: Intel + Apple Silicon)
# và Windows.
#   - Push tag `vX.Y.Z` (hoặc chạy tay CÓ nhập tag) → đính bộ cài vào GitHub Release.
#   - Chạy tay KHÔNG nhập tag → chỉ build + lưu artifact (thử CI, không phát hành).
#
# Lưu ý: bộ cài CHƯA KÝ — macOS Gatekeeper / Windows SmartScreen sẽ cảnh báo.
# `node electron/build.cjs` lo toàn bộ: giao diện (Vite), module native (Rust/napi),
# sidecar kdbx-import, staging và electron-builder.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release để đính bộ cài (vd v0.3.0). Để trống = chỉ build thử."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux — thư viện build + công cụ đóng gói rpm
        if: runner.os == 'Linux'
        # libdbus-1-dev: keyring (Secret Service qua D-Bus) cần lúc build module native.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config rpm xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: build cả hai kiến trúc rồi lipo thành universal (xem electron/build.cjs)
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target
            src-tauri/sidecar/kdbx-import -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build bộ cài
        run: node electron/build.cjs

      # Chạy bản đã đóng gói trong màn hình ảo, kiểm tra giao diện thật sự hiện ra
      # (chặn lỗi "mở lên màn hình đen" trước khi tới tay người dùng).
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node electron/smoke-test.cjs

      - name: Đính vào GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Termez ${{ env.RELEASE_TAG }}
          # Tag có hậu tố (vX.Y.Z-beta.N, -rc.N…) → pre-release, KHÔNG thành bản "latest"
          # (trình cập nhật trong app chỉ xem releases/latest nên không nhắc người dùng).
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: false
          files: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/*.msi

      - name: Lưu artifact (chạy thử)
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: termez-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/*.msi
