name: Build apps

# Build native installers for Linux, macOS (Apple Silicon + Intel) and Windows
# and attach them to the GitHub Release for the tag. Push a tag `vX.Y.Z`
# (or run manually with a tag) to trigger it.
#
# Note: builds are UNSIGNED — macOS Gatekeeper / Windows SmartScreen will warn.
# The sidecar (kdbx-import) and the frontend are built by tauri.conf's
# beforeBuildCommand, so no extra steps are needed here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build into (e.g. v0.2.11)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04    # Linux: .deb / .AppImage / .rpm
          - platform: macos-14        # macOS Apple Silicon (arm64): .dmg / .app
          - platform: macos-13        # macOS Intel (x86_64): .dmg / .app
          - platform: windows-latest  # Windows: .msi / NSIS .exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Termez ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
