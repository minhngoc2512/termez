name: Deploy website

# Build the Vue landing site (web/) and publish it to the ROOT of the gh-pages
# branch. The apt repo lives at gh-pages:/apt and is preserved (keep_files),
# so the site serves at https://<user>.github.io/termez/ and the apt repo stays
# at https://<user>.github.io/termez/apt/. Pages source stays "branch: gh-pages".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages (keep /apt)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web/dist
          keep_files: true            # đừng xoá thư mục apt/ đang có trên gh-pages
          commit_message: "Deploy website"
          enable_jekyll: false
