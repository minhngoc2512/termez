[package]
name = "termez"
version = "0.2.10"
description = "Termez — SSH/SFTP manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "termez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# russh dùng backend `ring` (thuần Rust) để tránh aws-lc-sys/nasm
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
# keychain OS: backend secret-service thuần Rust (zbus) — không cần libdbus/openssl
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
russh-sftp = "3.0.0"
tokio-socks = "0.5.3"
async-http-proxy = { version = "1.2.5", features = ["basic-auth", "runtime-tokio"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
rand = "0.8"
reqwest = { version = "=0.12.9", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Ký AWS SigV4 cho S3/R2/MinIO (thuần Rust, tự cô lập — không đụng crypto của russh)
hmac = "0.12"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
bytes = "1"
walkdir = "2"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth", "migration"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2.3.3"
# Lưu ý: import KeePass (.kdbx) chạy qua sidecar riêng (sidecar/kdbx-import) vì
# crate `keepass` 0.14 dùng thế hệ RustCrypto cũ, xung đột với russh 0.63.


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
