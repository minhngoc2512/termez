[package]
name = "termez-native"
version = "0.0.0"
edition = "2021"
publish = false
description = "SPIKE: backend Rust của Termez bọc thành module Node (napi) cho vỏ Electron"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "async"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
keyring = { version = "3", default-features = false }
tokio-socks = "0.5.3"
async-http-proxy = { version = "1.2.5", features = ["basic-auth", "runtime-tokio"] }
argon2 = "0.6.0"
rand = "0.8"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth", "migration"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
