[package]
name = "termez-native"
version = "0.3.0-beta.1" # = version app (app_version, check_update đọc giá trị này)
edition = "2021"
publish = false
description = "Backend Rust của Termez (nguyên văn từ src-tauri/src) bọc thành module Node (napi) cho bản Electron"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Crate giả mang tên `tauri` — backend dùng `tauri::…` mà không biết mình đang ở Electron.
tauri = { package = "termez-tauri-shim", path = "tauri-shim" }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "async"] }
napi-derive = "3"

# Giống dependency của src-tauri (trừ tauri + plugin). Giữ ĐỒNG BỘ khi sửa bên đó.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
keyring = { version = "3", default-features = false }
russh-sftp = "3.0.0"
tokio-socks = "0.5.3"
async-http-proxy = { version = "1.2.5", features = ["basic-auth", "runtime-tokio"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
rand = "0.8"
reqwest = { version = "=0.12.9", default-features = false, features = ["rustls-tls", "json", "stream"] }
hmac = "0.12"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
async-stream = "0.3"
bytes = "1"
walkdir = "2"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "gen_secret", "otpauth", "migration"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
